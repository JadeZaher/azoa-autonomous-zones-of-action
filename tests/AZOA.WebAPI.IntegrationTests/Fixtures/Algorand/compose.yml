# Derived from official AlgoKit v2.10.2 sandbox.py; public manifest digests captured 2026-10-15.
name: "azoa_native_avm"

services:
  algod:
    container_name: "azoa_native_avm_algod"
    image: algorand/algod@sha256:11f661ec65f511fc0d29a6a2a6610df3a8280e5c2d0b5f151d607cd4e0893c18
    ports:
      - 127.0.0.1:4001:8080
      - 127.0.0.1:4002:7833
      - 127.0.0.1:9392:9392
    environment:
      START_KMD: 1
      KMD_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ADMIN_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      GOSSIP_PORT: 10000
    init: true
    volumes:
      - type: bind
        source: ./algod_config.json
        target: /etc/algorand/config.json
      - type: bind
        source: ./algod_network_template.json
        target: /etc/algorand/template.json
      - ./goal_mount:/root/goal_mount

  conduit:
    container_name: "azoa_native_avm_conduit"
    image: algorandfoundation/conduit-localnet@sha256:c8b71a9e3916f0095367645767e78fce8d766f58400dcf796153fa68fdd38b90
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./conduit.yml
        target: /etc/algorand/conduit.yml
    depends_on:
      - indexer-db
      - algod

  indexer-db:
    container_name: "azoa_native_avm_postgres"
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    ports:
      - 127.0.0.1:5443:5432
    user: postgres
    environment:
      POSTGRES_USER: algorand
      POSTGRES_PASSWORD: algorand
      POSTGRES_DB: indexerdb

  indexer:
    container_name: "azoa_native_avm_indexer"
    image: algorand/indexer@sha256:a59088098c2386117550922a2876810dae133d4ba5cb50cdbf88b3c183f2fc4d
    ports:
      - 127.0.0.1:8980:8980
    restart: unless-stopped
    command: daemon --enable-all-parameters
    environment:
      INDEXER_POSTGRES_CONNECTION_STRING: "host=indexer-db port=5432 user=algorand password=algorand dbname=indexerdb sslmode=disable"
    depends_on:
      - conduit
