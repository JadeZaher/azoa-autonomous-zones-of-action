name: CI

# Build and test guard. This remains intentionally separate from release and
# deployment, but includes the SurrealDB-backed integration suite now that
# namespace isolation makes the full suite a meaningful green/red signal.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  dotnet:
    name: .NET build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore azoa.sln

      - name: Build
        run: dotnet build azoa.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/AZOA.WebAPI.Tests/AZOA.WebAPI.Tests.csproj --configuration Release --no-build

      - name: Start SurrealDB
        run: |
          docker run --detach \
            --name azoa-ci-surrealdb \
            --user 0:0 \
            --publish 8020:8000 \
            --env SURREAL_SYNC_DATA=true \
            --volume azoa-ci-surrealdb-data:/data \
            surrealdb/surrealdb:v3.1.4 \
            start --log info --user root --pass root --bind 0.0.0.0:8000 rocksdb:///data/db

          for attempt in {1..30}; do
            if docker exec azoa-ci-surrealdb /surreal is-ready --endpoint http://localhost:8000; then
              exit 0
            fi
            sleep 2
          done

          docker logs azoa-ci-surrealdb
          exit 1

      - name: Integration tests
        env:
          # G5's backup/restore drill shells out to the container runtime and
          # defaults to podman; the runner uses docker. Without this the drill
          # probes a podman container that cannot exist and fails hard under CI.
          AZOA_CONTAINER_RUNTIME: docker
          AZOA_SURREALDB_CONTAINER_NAME: azoa-ci-surrealdb
        run: dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "Category!=Chaos&Category!=Perf"

      - name: Conformance gate evidence
        env:
          AZOA_CONTAINER_RUNTIME: docker
          AZOA_SURREALDB_CONTAINER_NAME: azoa-ci-surrealdb
          CONFORMANCE_RESULTS: ${{ runner.temp }}/azoa-conformance
        run: |
          mkdir -p "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G1_CrashDurabilityTest" --logger "trx;LogFileName=G1.trx" --results-directory "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G2_IdempotencyTocTouTest" --logger "trx;LogFileName=G2.trx" --results-directory "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G3_InjectionSuiteTest.G3_ControllerPaths_HostileInput_LandsAsLiteralNotSurrealQl|FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G3_InjectionSuiteTest.G3_DirectWithParam_HostileInput_PersistsAsLiteralString" --logger "trx;LogFileName=G3.trx" --results-directory "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G5_RestoreDrillTest" --logger "trx;LogFileName=G5.trx" --results-directory "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G7_ReconciliationDrillTest" --logger "trx;LogFileName=G7.trx" --results-directory "$CONFORMANCE_RESULTS"
          python3 - "$CONFORMANCE_RESULTS" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = {
              "G1": "G1_CrashDurabilityTest",
              "G2": "G2_IdempotencyTocTouTest",
              "G3": "G3_InjectionSuiteTest",
              "G5": "G5_RestoreDrillTest",
              "G7": "G7_ReconciliationDrillTest",
          }
          required_methods = {
              "G3": {
                  "AZOA.WebAPI.IntegrationTests.Gates.G3_InjectionSuiteTest.G3_ControllerPaths_HostileInput_LandsAsLiteralNotSurrealQl",
                  "AZOA.WebAPI.IntegrationTests.Gates.G3_InjectionSuiteTest.G3_DirectWithParam_HostileInput_PersistsAsLiteralString",
              },
          }
          directory = Path(sys.argv[1])
          for gate, class_name in expected.items():
              path = directory / f"{gate}.trx"
              results = [element for element in ET.parse(path).iter()
                         if element.tag.rsplit("}", 1)[-1] == "UnitTestResult"]
              prefix = f"AZOA.WebAPI.IntegrationTests.Gates.{class_name}."
              result_names = [result.get("testName", "") for result in results]
              if not results or any(result.get("outcome") != "Passed" or not
                                    result.get("testName", "").startswith(prefix)
                                    for result in results):
                  raise SystemExit(f"Invalid conformance TRX: {path}")
              if gate in required_methods and (set(result_names) != required_methods[gate]
                                               or len(result_names) != len(required_methods[gate])):
                  raise SystemExit(f"Incomplete conformance TRX: {path}")
          PY

      - name: Package conformance gate evidence
        if: success()
        env:
          CONFORMANCE_RESULTS: ${{ runner.temp }}/azoa-conformance
        run: |
          files_json=$(for file in "$CONFORMANCE_RESULTS"/G{1,2,3,5,7}.trx; do
            jq -n --arg name "$(basename "$file")" --arg sha256 "$(sha256sum "$file" | awk '{print $1}')" '{name: $name, sha256: $sha256}'
          done | jq -s .)
          jq -n \
            --arg schema "azoa-node-conformance-evidence/v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg expiresAt "$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$files_json" \
            '{schema: $schema, repository: $repository, commit: $commit, workflow: $workflow, runId: $runId, generatedAt: $generatedAt, expiresAt: $expiresAt, files: $files}' \
            > "$CONFORMANCE_RESULTS/metadata.json"
          tar --create --gzip --file "$CONFORMANCE_RESULTS/conformance-evidence.tar.gz" \
            --directory "$CONFORMANCE_RESULTS" metadata.json G1.trx G2.trx G3.trx G5.trx G7.trx

      - name: Attest conformance evidence
        if: success() && github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/azoa-conformance/conformance-evidence.tar.gz

      - name: Upload conformance evidence bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azoa-node-conformance-${{ github.sha }}
          path: ${{ runner.temp }}/azoa-conformance/conformance-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30

  schema-job:
    name: Schema job (apply + converge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Start SurrealDB
        run: |
          docker run --detach \
            --name azoa-schema-ci \
            --user 0:0 \
            --publish 8030:8000 \
            --env SURREAL_SYNC_DATA=true \
            surrealdb/surrealdb:v3.1.4 \
            start --log warn --user root --pass root --bind 0.0.0.0:8000 rocksdb:///data/db

          for attempt in {1..30}; do
            if docker exec azoa-schema-ci /surreal is-ready --endpoint http://localhost:8000; then
              exit 0
            fi
            sleep 2
          done

          docker logs azoa-schema-ci
          exit 1

      # As of 1.2.0 the CLI is its own package (SurrealForge.Cli, a real
      # DotnetTool); SurrealForge.Schema is a plain library with no tools/
      # payload. The version is taken from the SurrealForge.Schema
      # PackageReference because the suite publishes in lockstep, so the CLI
      # under test cannot drift from the library the app restores -- a
      # hard-coded copy is what broke the production image build.
      - name: Install the schema CLI at the referenced version
        run: |
          version=$(python3 - <<'PY'
          import re, pathlib
          csproj = pathlib.Path("AZOA.WebAPI.csproj").read_text(encoding="utf-8-sig")
          match = re.search(r'Include="SurrealForge\.Schema"\s+Version="([^"]+)"', csproj)
          if not match:
              raise SystemExit("SurrealForge.Schema PackageReference not found in AZOA.WebAPI.csproj")
          print(match.group(1))
          PY
          )
          echo "Schema CLI version: $version"

          dotnet tool install --global SurrealForge.Cli --version "$version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # docker-entrypoint.sh's schema mode applies Generated/Schemas PLUS
      # CompatibilityBaselines from one directory. Composing the same set here
      # is what makes this job test the deploy path rather than a subset of it:
      # the two produce different reconcile plans.
      - name: Compose the schema set the deploy path applies
        run: |
          mkdir -p "$RUNNER_TEMP/azoa-schemas"
          cp Persistence/SurrealDb/Generated/Schemas/*.surql "$RUNNER_TEMP/azoa-schemas/"
          if [ -d Persistence/SurrealDb/CompatibilityBaselines ]; then
            cp Persistence/SurrealDb/CompatibilityBaselines/*.surql "$RUNNER_TEMP/azoa-schemas/"
          fi
          echo "SCHEMAS_DIR=$RUNNER_TEMP/azoa-schemas" >> "$GITHUB_ENV"
          echo "Composed $(ls "$RUNNER_TEMP/azoa-schemas" | wc -l) schema file(s)."

      - name: Apply schemas + migrations
        run: |
          surrealforge up \
            --connection http://127.0.0.1:8030 \
            --user root --pass root \
            --namespace azoa --database azoa \
            --schemas-dir "$SCHEMAS_DIR" \
            --migrations-dir Persistence/SurrealDb/Migrations \
            --applied-by "ci/${{ github.sha }}" \
            | tee apply.log

      # The migration path has to be re-runnable: a second `up` against an
      # already-current database must change nothing. Phase 3 reconcile
      # previously re-evolved 144 fields on every run because it read SurrealDB's
      # own spelling of a definition back as drift, so this never settled.
      - name: Re-run must be a no-op
        run: |
          surrealforge up \
            --connection http://127.0.0.1:8030 \
            --user root --pass root \
            --namespace azoa --database azoa \
            --schemas-dir "$SCHEMAS_DIR" \
            --migrations-dir Persistence/SurrealDb/Migrations \
            --applied-by "ci/${{ github.sha }}-rerun" \
            | tee rerun.log

          summary=$(grep -E '^applied ' rerun.log | tail -1)
          echo "Re-run summary: $summary"

          applied=$(sed -E 's/^applied ([0-9]+).*/\1/' <<<"$summary")
          evolved=$(sed -E 's/.*evolved ([0-9]+).*/\1/' <<<"$summary")

          if [ "$applied" != "0" ] || [ "$evolved" != "0" ]; then
            echo "::error::Schema job is not idempotent: re-run applied=$applied evolved=$evolved (both must be 0)."
            exit 1
          fi

      # Mirrors docker-entrypoint.sh's schema mode: the schema owner defines the
      # runtime identity the API later authenticates as.
      - name: Provision the database-scoped runtime user
        env:
          RUNTIME_PASSWORD: ci-runtime-password-that-is-long-enough
        run: |
          query="DEFINE USER OVERWRITE azoa_runtime ON DATABASE PASSWORD '$RUNTIME_PASSWORD' ROLES EDITOR;"
          response=$(printf '%s' "$query" | curl -fsS \
            --user "root:root" \
            --header "Surreal-NS: azoa" \
            --header "Surreal-DB: azoa" \
            --header "Accept: application/json" \
            --header "Content-Type: application/surrealql" \
            --data-binary @- \
            "http://127.0.0.1:8030/sql")

          echo "$response"
          grep -q '"status":"OK"' <<<"$response" || {
            echo "::error::Runtime user was not provisioned."
            exit 1
          }

      # The API is forbidden root and authenticates as this scoped user, so the
      # least-privilege split only holds if the identity the schema job creates
      # can actually reach the schema. SurrealDB refuses HTTP Basic Auth for a
      # database-scoped user: it has to exchange credentials for a token first,
      # which is what the runtime client does.
      - name: Runtime user can reach the schema without root
        env:
          RUNTIME_PASSWORD: ci-runtime-password-that-is-long-enough
        run: |
          credentials=$(python3 -c 'import json, os; print(json.dumps({"ns": "azoa", "db": "azoa", "user": "azoa_runtime", "pass": os.environ["RUNTIME_PASSWORD"]}))')

          token=$(curl -fsS -X POST "http://127.0.0.1:8030/signin" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$credentials" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin).get("token", ""))')

          if [ -z "$token" ]; then
            echo "::error::Database-scoped runtime user could not sign in."
            exit 1
          fi

          info=$(printf '%s' "INFO FOR DB;" | curl -fsS \
            --header "Authorization: Bearer $token" \
            --header "Surreal-NS: azoa" \
            --header "Surreal-DB: azoa" \
            --header "Accept: application/json" \
            --header "Content-Type: application/surrealql" \
            --data-binary @- \
            "http://127.0.0.1:8030/sql")

          grep -q '"status":"OK"' <<<"$info" || {
            echo "::error::Runtime user cannot read the schema it must serve."
            exit 1
          }
          echo "Runtime user read the schema without root."

  sdk:
    name: SDK build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/azoa-wallet
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  frontend:
    name: Frontend audit + lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  release-blueprint:
    name: Railway blueprint contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate operator-gated template
        run: python3 deploy/railway/render-template.py --check
