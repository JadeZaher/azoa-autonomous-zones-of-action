name: CI

# Build and test guard. This remains intentionally separate from release and
# deployment, but includes the SurrealDB-backed integration suite now that
# namespace isolation makes the full suite a meaningful green/red signal.
#
# Every test suite in the repo runs from here, so none of them can rot unseen:
#   dotnet      -> unit tests + integration tests (Category != Chaos, Perf)
#                  + the five conformance gates (which re-admit the Chaos-traited
#                    G1 by name, so Chaos is covered too)
#   perf        -> the Perf-traited SurrealPerfBudgets class the dotnet job excludes
#   sdk         -> sdk/azoa-wallet vitest
#   frontend    -> frontend vitest (unit + MSW slices on jsdom), plus lint/typecheck/build
#   frontend-browser -> the MSW slices in real Chromium (Vitest browser mode)
#   e2e         -> Playwright journeys on the azoa-e2e compose project with fake vendors
#   secret-scan -> gitleaks over the working tree AND the full history
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# One pin, referenced by every job that needs a server. There were two literal
# copies of this tag before; a third for the perf job would have made "which
# SurrealDB does CI actually test against" a question with three answers.
# The release path pins by digest instead (conformance-release.yml,
# deploy/railway/template.json) because it publishes immutable images -- that is
# a deliberately different guarantee, not a second copy of this one.
env:
  SURREALDB_IMAGE: surrealdb/surrealdb:v3.1.4
  # Pinned scanner version. Swap for an image digest once someone resolves one:
  # an unpinned scanner is a supply-chain hole in the job that exists to close
  # supply-chain holes.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.18.4

jobs:
  dotnet:
    name: .NET build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore azoa.sln

      - name: Build
        run: dotnet build azoa.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/AZOA.WebAPI.Tests/AZOA.WebAPI.Tests.csproj --configuration Release --no-build

      # The Ethereum protocol fixtures (Fixtures/Ethereum/*.mjs) spawn a loopback
      # Hardhat chain from contracts/ethereum and deploy its compiled artifacts;
      # without these steps EthereumProtocolTests/EthereumDexProtocolTests fail
      # at chain setup. The contract unit tests run on the same pinned chain.
      - name: Setup Node (Ethereum contracts)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"

      - name: Ethereum contracts — install, build, unit tests
        working-directory: contracts/ethereum
        run: |
          npm ci
          npm run build
          npm test

      - name: Start SurrealDB
        run: |
          docker run --detach \
            --name azoa-ci-surrealdb \
            --user 0:0 \
            --publish 8020:8000 \
            --env SURREAL_SYNC_DATA=true \
            --volume azoa-ci-surrealdb-data:/data \
            "$SURREALDB_IMAGE" \
            start --log info --user root --pass root --bind 0.0.0.0:8000 rocksdb:///data/db

          for attempt in {1..30}; do
            if docker exec azoa-ci-surrealdb /surreal is-ready --endpoint http://localhost:8000; then
              exit 0
            fi
            sleep 2
          done

          docker logs azoa-ci-surrealdb
          exit 1

      - name: Integration tests
        env:
          # G5's backup/restore drill shells out to the container runtime and
          # defaults to podman; the runner uses docker. Without this the drill
          # probes a podman container that cannot exist and fails hard under CI.
          AZOA_CONTAINER_RUNTIME: docker
          AZOA_SURREALDB_CONTAINER_NAME: azoa-ci-surrealdb
        run: dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "Category!=Chaos&Category!=Perf"

      - name: Conformance gate evidence
        env:
          AZOA_CONTAINER_RUNTIME: docker
          AZOA_SURREALDB_CONTAINER_NAME: azoa-ci-surrealdb
          CONFORMANCE_RESULTS: ${{ runner.temp }}/azoa-conformance
        run: |
          mkdir -p "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G1_CrashDurabilityTest" --logger "trx;LogFileName=G1.trx" --results-directory "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G2_IdempotencyTocTouTest" --logger "trx;LogFileName=G2.trx" --results-directory "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G3_InjectionSuiteTest.G3_ControllerPaths_HostileInput_LandsAsLiteralNotSurrealQl|FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G3_InjectionSuiteTest.G3_DirectWithParam_HostileInput_PersistsAsLiteralString" --logger "trx;LogFileName=G3.trx" --results-directory "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G5_RestoreDrillTest" --logger "trx;LogFileName=G5.trx" --results-directory "$CONFORMANCE_RESULTS"
          dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AZOA.WebAPI.IntegrationTests.Gates.G7_ReconciliationDrillTest" --logger "trx;LogFileName=G7.trx" --results-directory "$CONFORMANCE_RESULTS"
          python3 - "$CONFORMANCE_RESULTS" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = {
              "G1": "G1_CrashDurabilityTest",
              "G2": "G2_IdempotencyTocTouTest",
              "G3": "G3_InjectionSuiteTest",
              "G5": "G5_RestoreDrillTest",
              "G7": "G7_ReconciliationDrillTest",
          }
          required_methods = {
              "G3": {
                  "AZOA.WebAPI.IntegrationTests.Gates.G3_InjectionSuiteTest.G3_ControllerPaths_HostileInput_LandsAsLiteralNotSurrealQl",
                  "AZOA.WebAPI.IntegrationTests.Gates.G3_InjectionSuiteTest.G3_DirectWithParam_HostileInput_PersistsAsLiteralString",
              },
          }
          directory = Path(sys.argv[1])
          for gate, class_name in expected.items():
              path = directory / f"{gate}.trx"
              results = [element for element in ET.parse(path).iter()
                         if element.tag.rsplit("}", 1)[-1] == "UnitTestResult"]
              prefix = f"AZOA.WebAPI.IntegrationTests.Gates.{class_name}."
              result_names = [result.get("testName", "") for result in results]
              if not results or any(result.get("outcome") != "Passed" or not
                                    result.get("testName", "").startswith(prefix)
                                    for result in results):
                  raise SystemExit(f"Invalid conformance TRX: {path}")
              if gate in required_methods and (set(result_names) != required_methods[gate]
                                               or len(result_names) != len(required_methods[gate])):
                  raise SystemExit(f"Incomplete conformance TRX: {path}")
          PY

      - name: Package conformance gate evidence
        if: success()
        env:
          CONFORMANCE_RESULTS: ${{ runner.temp }}/azoa-conformance
        run: |
          files_json=$(for file in "$CONFORMANCE_RESULTS"/G{1,2,3,5,7}.trx; do
            jq -n --arg name "$(basename "$file")" --arg sha256 "$(sha256sum "$file" | awk '{print $1}')" '{name: $name, sha256: $sha256}'
          done | jq -s .)
          jq -n \
            --arg schema "azoa-node-conformance-evidence/v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg expiresAt "$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$files_json" \
            '{schema: $schema, repository: $repository, commit: $commit, workflow: $workflow, runId: $runId, generatedAt: $generatedAt, expiresAt: $expiresAt, files: $files}' \
            > "$CONFORMANCE_RESULTS/metadata.json"
          tar --create --gzip --file "$CONFORMANCE_RESULTS/conformance-evidence.tar.gz" \
            --directory "$CONFORMANCE_RESULTS" metadata.json G1.trx G2.trx G3.trx G5.trx G7.trx

      - name: Attest conformance evidence
        if: success() && github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/azoa-conformance/conformance-evidence.tar.gz

      - name: Upload conformance evidence bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azoa-node-conformance-${{ github.sha }}
          path: ${{ runner.temp }}/azoa-conformance/conformance-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30

  schema-job:
    name: Schema job (apply + converge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Start SurrealDB
        run: |
          docker run --detach \
            --name azoa-schema-ci \
            --user 0:0 \
            --publish 8030:8000 \
            --env SURREAL_SYNC_DATA=true \
            "$SURREALDB_IMAGE" \
            start --log warn --user root --pass root --bind 0.0.0.0:8000 rocksdb:///data/db

          for attempt in {1..30}; do
            if docker exec azoa-schema-ci /surreal is-ready --endpoint http://localhost:8000; then
              exit 0
            fi
            sleep 2
          done

          docker logs azoa-schema-ci
          exit 1

      # As of 1.2.0 the CLI is its own package (SurrealForge.Cli, a real
      # DotnetTool); SurrealForge.Schema is a plain library with no tools/
      # payload. The version is taken from the SurrealForge.Schema
      # PackageReference because the suite publishes in lockstep, so the CLI
      # under test cannot drift from the library the app restores -- a
      # hard-coded copy is what broke the production image build.
      - name: Install the schema CLI at the referenced version
        run: |
          version=$(python3 - <<'PY'
          import re, pathlib
          csproj = pathlib.Path("AZOA.WebAPI.csproj").read_text(encoding="utf-8-sig")
          match = re.search(r'Include="SurrealForge\.Schema"\s+Version="([^"]+)"', csproj)
          if not match:
              raise SystemExit("SurrealForge.Schema PackageReference not found in AZOA.WebAPI.csproj")
          print(match.group(1))
          PY
          )
          echo "Schema CLI version: $version"

          dotnet tool install --global SurrealForge.Cli --version "$version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # docker-entrypoint.sh's schema mode applies Generated/Schemas PLUS
      # CompatibilityBaselines from one directory with --no-reconcile. Composing
      # the same set here is what makes this job test the deploy path rather
      # than a subset of it (Persistence/SurrealDb/AGENTS.md §deploy-path).
      - name: Compose the schema set the deploy path applies
        run: |
          mkdir -p "$RUNNER_TEMP/azoa-schemas"
          cp Persistence/SurrealDb/Generated/Schemas/*.surql "$RUNNER_TEMP/azoa-schemas/"
          if [ -d Persistence/SurrealDb/CompatibilityBaselines ]; then
            cp Persistence/SurrealDb/CompatibilityBaselines/*.surql "$RUNNER_TEMP/azoa-schemas/"
          fi
          echo "SCHEMAS_DIR=$RUNNER_TEMP/azoa-schemas" >> "$GITHUB_ENV"
          echo "Composed $(ls "$RUNNER_TEMP/azoa-schemas" | wc -l) schema file(s)."

      - name: Apply schemas + migrations
        run: |
          surrealforge up \
            --connection http://127.0.0.1:8030 \
            --user root --pass root \
            --namespace azoa --database azoa \
            --schemas-dir "$SCHEMAS_DIR" \
            --migrations-dir Persistence/SurrealDb/Migrations \
            --no-reconcile \
            --applied-by "ci/${{ github.sha }}" \
            | tee apply.log

      # The migration path has to be re-runnable: a second `up` against an
      # already-current database must change nothing.
      - name: Re-run must be a no-op
        run: |
          surrealforge up \
            --connection http://127.0.0.1:8030 \
            --user root --pass root \
            --namespace azoa --database azoa \
            --schemas-dir "$SCHEMAS_DIR" \
            --migrations-dir Persistence/SurrealDb/Migrations \
            --no-reconcile \
            --applied-by "ci/${{ github.sha }}-rerun" \
            | tee rerun.log

          summary=$(grep -E '^applied ' rerun.log | tail -1)
          echo "Re-run summary: $summary"

          applied=$(sed -E 's/^applied ([0-9]+).*/\1/' <<<"$summary")
          evolved=$(sed -E 's/.*evolved ([0-9]+).*/\1/' <<<"$summary")

          if [ "$applied" != "0" ] || [ "$evolved" != "0" ]; then
            echo "::error::Schema job is not idempotent: re-run applied=$applied evolved=$evolved (both must be 0)."
            exit 1
          fi

      # The deploy path (baselines + forward migrations) must land on exactly the
      # schema the POCOs generate. Apply Generated/Schemas alone to a reference
      # database and require identical INFO FOR TABLE output for every table.
      - name: Deploy path converges to the generated model
        run: |
          surrealforge up \
            --connection http://127.0.0.1:8030 \
            --user root --pass root \
            --namespace azoa --database azoa_reference \
            --schemas-dir Persistence/SurrealDb/Generated/Schemas \
            --migrations-dir Persistence/SurrealDb/Migrations \
            --no-reconcile \
            --applied-by "ci/${{ github.sha }}-reference" > reference.log

          python3 - <<'PY'
          import base64, json, sys, urllib.request

          def query(database, sql):
              request = urllib.request.Request(
                  "http://127.0.0.1:8030/sql", data=sql.encode(), method="POST",
                  headers={"Surreal-NS": "azoa", "Surreal-DB": database, "Accept": "application/json",
                           "Authorization": "Basic " + base64.b64encode(b"root:root").decode()})
              result = json.load(urllib.request.urlopen(request))[0]
              if result.get("status") != "OK":
                  raise SystemExit(f"{database}: {sql} -> {result}")
              return result["result"]

          def snapshot(database):
              tables = query(database, "INFO FOR DB;")["tables"]
              return {name: query(database, f"INFO FOR TABLE {name};")
                      for name in sorted(tables) if name != "schema_migration"}

          deployed, reference = snapshot("azoa"), snapshot("azoa_reference")
          differences = [name for name in sorted(set(deployed) | set(reference))
                         if deployed.get(name) != reference.get(name)]
          for name in differences:
              print(f"::error::{name} differs between the deploy path and Generated/Schemas")
              print(json.dumps({"deployed": deployed.get(name), "generated": reference.get(name)}, indent=1, sort_keys=True))
          print(f"Compared {len(reference)} table(s); {len(differences)} difference(s).")
          sys.exit(1 if differences else 0)
          PY

      # Mirrors docker-entrypoint.sh's schema mode: the schema owner defines the
      # runtime identity the API later authenticates as.
      - name: Provision the database-scoped runtime user
        env:
          RUNTIME_PASSWORD: ci-runtime-password-that-is-long-enough
        run: |
          query="DEFINE USER OVERWRITE azoa_runtime ON DATABASE PASSWORD '$RUNTIME_PASSWORD' ROLES EDITOR;"
          response=$(printf '%s' "$query" | curl -fsS \
            --user "root:root" \
            --header "Surreal-NS: azoa" \
            --header "Surreal-DB: azoa" \
            --header "Accept: application/json" \
            --header "Content-Type: application/surrealql" \
            --data-binary @- \
            "http://127.0.0.1:8030/sql")

          echo "$response"
          grep -q '"status":"OK"' <<<"$response" || {
            echo "::error::Runtime user was not provisioned."
            exit 1
          }

      # The API is forbidden root and authenticates as this scoped user, so the
      # least-privilege split only holds if the identity the schema job creates
      # can actually reach the schema. SurrealDB refuses HTTP Basic Auth for a
      # database-scoped user: it has to exchange credentials for a token first,
      # which is what the runtime client does.
      - name: Runtime user can reach the schema without root
        env:
          RUNTIME_PASSWORD: ci-runtime-password-that-is-long-enough
        run: |
          credentials=$(python3 -c 'import json, os; print(json.dumps({"ns": "azoa", "db": "azoa", "user": "azoa_runtime", "pass": os.environ["RUNTIME_PASSWORD"]}))')

          token=$(curl -fsS -X POST "http://127.0.0.1:8030/signin" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$credentials" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin).get("token", ""))')

          if [ -z "$token" ]; then
            echo "::error::Database-scoped runtime user could not sign in."
            exit 1
          fi

          info=$(printf '%s' "INFO FOR DB;" | curl -fsS \
            --header "Authorization: Bearer $token" \
            --header "Surreal-NS: azoa" \
            --header "Surreal-DB: azoa" \
            --header "Accept: application/json" \
            --header "Content-Type: application/surrealql" \
            --data-binary @- \
            "http://127.0.0.1:8030/sql")

          grep -q '"status":"OK"' <<<"$info" || {
            echo "::error::Runtime user cannot read the schema it must serve."
            exit 1
          }
          echo "Runtime user read the schema without root."

  sdk:
    name: SDK build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/azoa-wallet
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  frontend:
    name: Frontend audit + lint + typecheck + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
          # Both lockfiles: this job installs the SDK's dependencies too, so
          # keying the cache on the frontend lockfile alone would keep serving a
          # stale entry after an SDK dependency bump.
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/azoa-wallet/package-lock.json

      # `frontend` depends on `azoa-sdk` as `file:../sdk/azoa-wallet`, which npm
      # SYMLINKS rather than copies, and every entry point in that package
      # points into `dist/` -- which is gitignored and therefore absent from a
      # fresh checkout. Without a tsup build here the link resolves to a
      # directory with no `dist`, and lint, typecheck, vitest and `next build`
      # all fail on the first `azoa-sdk` import. (`next.config.js` pins the
      # Turbopack root to the repo so the symlink resolves at all; that only
      # helps once there is something at the other end of it.) The `sdk` job
      # builds its own copy on a different runner, so this cannot be inherited.
      - name: Install SDK dependencies
        working-directory: sdk/azoa-wallet
        run: npm ci

      - name: Build the SDK so the path dependency resolves
        working-directory: sdk/azoa-wallet
        run: npm run build

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # vitest + jsdom over src/**/*.test.{ts,tsx} (vitest.config.ts). These
      # cover the action-builder canvas -- history, selection, the render-loop
      # regression -- which is exactly the code a typecheck cannot vouch for.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The MSW feature slices again, in real Chromium (Vitest browser mode, Playwright
  # provider): real layout, real fetch, a real Service Worker. `npm test` above already
  # runs the same slice files on jsdom. See frontend/src/test/AGENTS.md.
  frontend-browser:
    name: Frontend slices in Chromium (Vitest browser mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/azoa-wallet/package-lock.json

      # Slices resolve azoa-sdk to the SDK SOURCE (vitest.config.ts), so the SDK's own
      # dependencies must be installed; no tsup build is needed.
      - name: Install SDK dependencies
        working-directory: sdk/azoa-wallet
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed by the exact Playwright version so a bump downloads matching browsers.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Slices in Chromium
        run: npm run test:browser

  # Playwright journeys against the self-contained `azoa-e2e` compose project (its own SurrealDB,
  # API and frontend images): the API calls host-run fake Identomat/Stripe servers over HTTPS with
  # per-run secrets and trusts only a throwaway CA, and global setup proves real vendors are
  # unreachable. The frontend image builds the SDK itself (frontend/e2e/stack/frontend.Dockerfile).
  # See frontend/e2e/AGENTS.md.
  e2e:
    name: E2E journeys (Playwright, azoa-e2e stack, fake vendors)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Host side runs only Playwright and the fake vendors; neither imports the SDK.
      - name: Install dependencies
        run: npm ci

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Generates the CA, the trust directory and per-run secrets, builds both images, waits for health.
      - name: Bring up the E2E stack
        run: node e2e/scripts/e2e-stack.mjs up

      - name: Journeys
        run: npm run test:e2e

      - name: Collect stack logs on failure
        if: failure()
        run: node e2e/scripts/e2e-stack.mjs logs || true

      - name: Upload traces, screenshots and the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ github.sha }}
          path: frontend/e2e/.output/
          if-no-files-found: ignore
          retention-days: 14

      # Compose needs the run's generated values to interpolate the file, so teardown goes through
      # the same script; CI=true makes it remove the project's volumes too.
      - name: Tear down the stack
        if: always()
        run: node e2e/scripts/e2e-stack.mjs down || true

  perf:
    name: SurrealDB perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore azoa.sln

      - name: Build
        run: dotnet build azoa.sln --configuration Release --no-restore

      # tests/AZOA.WebAPI.IntegrationTests/Perf/SurrealPerfBudgets.cs is
      # [Trait("Category", "Perf")], which the dotnet job filters out
      # (Category!=Chaos&Category!=Perf). This job is the only place it runs.
      # It talks straight to SurrealTestDefaults.Endpoint -- http://127.0.0.1:8020,
      # root/root, a compile-time constant with no env-var indirection -- so the
      # port publication has to match the dotnet job's exactly.
      #
      # No named volume here, unlike the dotnet job: the suite creates and drops
      # its own per-run namespace and must not inherit a previous run's state.
      # Why this job blocks rather than reporting: it asserts an 8x regression
      # ceiling, not the declared latency targets, so it fails on a broken store
      # or an order-of-magnitude regression -- not on runner noise. The declared
      # targets are printed per run instead. Derivation: Perf/AGENTS.md.
      - name: Start SurrealDB
        run: |
          docker run --detach \
            --name azoa-perf-surrealdb \
            --user 0:0 \
            --publish 8020:8000 \
            --env SURREAL_SYNC_DATA=true \
            "$SURREALDB_IMAGE" \
            start --log warn --user root --pass root --bind 0.0.0.0:8000 rocksdb:///data/db

          for attempt in {1..30}; do
            if docker exec azoa-perf-surrealdb /surreal is-ready --endpoint http://localhost:8000; then
              exit 0
            fi
            sleep 2
          done

          docker logs azoa-perf-surrealdb
          exit 1

      # SurrealPerfBudgets is [SkippableFact] and skips when it cannot reach the
      # server, so a vacuous green would be indistinguishable from a real one in
      # the test output. Two independent controls close that hole: this step
      # fails from the host on the same published port the tests use, and
      # AZOA_PERF_REQUIRE_SURREAL below turns the skip itself into a thrown
      # failure inside InitializeAsync. Removing either one lets this job pass
      # while running nothing.
      - name: Prove the port the tests probe is answering
        run: curl -fsS --max-time 10 http://127.0.0.1:8020/health

      - name: Perf budget tests
        env:
          # Without this the suite skips instead of failing when SurrealDB is
          # unreachable, and the job goes green having executed no assertion.
          AZOA_PERF_REQUIRE_SURREAL: "1"
        run: dotnet test tests/AZOA.WebAPI.IntegrationTests/AZOA.WebAPI.IntegrationTests.csproj --configuration Release --no-build --filter "Category=Perf" --logger "console;verbosity=detailed"

      - name: SurrealDB logs on failure
        if: failure()
        run: docker logs azoa-perf-surrealdb

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history on purpose. A credential that was committed and then
          # "removed" in a later commit is still in the pack and still leaked;
          # the default shallow clone would hide precisely those.
          fetch-depth: 0

      # Allowlist: .gitleaks.toml -- exact reviewed values only, default rules kept
      # (review notes: .github/AGENTS.md §gitleaks).
      # Two passes, because they answer different questions. `detect` walks the
      # commit graph (was a secret ever committed?); `detect --no-git` reads the
      # working tree (is one sitting in the checkout right now, e.g. arriving
      # via a generated or untracked file?). Run as the runner's own uid so the
      # report lands writable and git does not flag the bind mount as
      # dubiously-owned; the checkout itself is mounted read-only.
      - name: Scan commit history
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks:/out" \
            "$GITLEAKS_IMAGE" \
            detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --exit-code 1 \
              --report-format sarif \
              --report-path /out/history.sarif

      - name: Scan the working tree
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks:/out" \
            "$GITLEAKS_IMAGE" \
            detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --no-git \
              --redact \
              --no-banner \
              --exit-code 1 \
              --report-format sarif \
              --report-path /out/worktree.sarif

      # --redact means the reports name the file, line and rule but not the
      # secret, so they are safe to keep as a build artifact.
      - name: Upload gitleaks reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-${{ github.sha }}
          path: ${{ runner.temp }}/gitleaks/*.sarif
          if-no-files-found: ignore
          retention-days: 14

  release-blueprint:
    name: Railway blueprint contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate operator-gated template
        run: python3 deploy/railway/render-template.py --check
