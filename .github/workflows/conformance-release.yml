name: Publish exact-c7 storage-maintenance API image only

on:
  workflow_dispatch:
    inputs:
      reviewed_workflow_sha:
        description: Independently reviewed commit on this maintenance branch, not c7 build source.
        required: true
        type: string
      ci_artifact_id:
        description: Fresh exact-c7 conformance artifact ID from the source-only validation branch.
        required: true
        type: string

concurrency:
  group: c7-storage-maintenance-publication
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.repository == 'JadeZaher/azoa-autonomous-zones-of-action' && github.ref == 'refs/heads/codex/c7-storage-maintenance-image-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      BUILD_SOURCE_SHA: c7cfa4af82c99e130a26064054ea7c52ab2603bb
      IMAGE_NAME: ghcr.io/jadezaher/azoa-autonomous-zones-of-action
      CI_RUN_ID: '41461162520'
      CI_RUN_ATTEMPT: '1'
    steps:
      - name: Check out reviewed publication tooling only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate reviewed workflow revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$GITHUB_SHA" != "$BUILD_SOURCE_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          mkdir -p "$RUNNER_TEMP/c7-maintenance"

      - name: Download specific refreshed source CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.ci_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/attempts/$CI_RUN_ATTEMPT" > "$RUNNER_TEMP/c7-maintenance/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/c7-maintenance/artifact.json"
          python3 deploy/railway/maintenance-image-proof.py evidence-metadata "$RUNNER_TEMP/c7-maintenance"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/c7-maintenance/evidence.zip"
          python3 deploy/railway/maintenance-image-proof.py evidence "$RUNNER_TEMP/c7-maintenance"
          gh attestation verify "$RUNNER_TEMP/c7-maintenance/conformance-evidence.tar.gz" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --signer-digest "$BUILD_SOURCE_SHA" \
            --source-digest "$BUILD_SOURCE_SHA" --source-ref refs/heads/codex/c7-storage-validation-20261102 \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/c7-maintenance/evidence-attestation.json"
          python3 deploy/railway/maintenance-image-proof.py evidence-attestation "$RUNNER_TEMP/c7-maintenance"

      - name: Create isolated BuildKit builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 verified 2026-11-02

      - name: Log in to this repository's container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish standard Dockerfile from exact immutable Git context
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: https://github.com/JadeZaher/azoa-autonomous-zones-of-action.git#c7cfa4af82c99e130a26064054ea7c52ab2603bb
          file: Dockerfile
          platforms: linux/amd64
          build-args: SOURCE_REVISION=c7cfa4af82c99e130a26064054ea7c52ab2603bb
          provenance: mode=max
          outputs: type=image,name=ghcr.io/jadezaher/azoa-autonomous-zones-of-action,push-by-digest=true,name-canonical=true,push=true
          github-token: ${{ github.token }}
          labels: |
            org.opencontainers.image.source=https://github.com/JadeZaher/azoa-autonomous-zones-of-action
            org.opencontainers.image.revision=c7cfa4af82c99e130a26064054ea7c52ab2603bb
            io.azoa.release-purpose=storage-maintenance-only
            io.azoa.publication-workflow-revision=${{ github.sha }}

      - name: Attest emitted index with reviewed workflow identity
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/jadezaher/azoa-autonomous-zones-of-action
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify anonymous public pull and bound Git-source provenance
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 deploy/railway/maintenance-image-proof.py image "$INDEX_DIGEST" "$RUNNER_TEMP/c7-maintenance"
          mkdir -m 700 "$RUNNER_TEMP/c7-anonymous-docker"
          docker --config "$RUNNER_TEMP/c7-anonymous-docker" pull --platform linux/amd64 "$IMAGE_NAME@$INDEX_DIGEST"
          gh attestation verify "oci://$IMAGE_NAME@$INDEX_DIGEST" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/conformance-release.yml" \
            --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/codex/c7-storage-maintenance-image-20261102 \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/c7-maintenance/image-attestation.json"
          python3 deploy/railway/maintenance-image-proof.py receipt "$INDEX_DIGEST" "$RUNNER_TEMP/c7-maintenance"
          {
            echo '## Storage-maintenance candidate only; no deployment performed'
            echo "Immutable API image: \`$IMAGE_NAME@$INDEX_DIGEST\`"
            echo "Build source: \`$BUILD_SOURCE_SHA\`; publication workflow: \`$GITHUB_SHA\`."
            echo 'Anonymous pull and embedded BuildKit source verification passed.'
            echo 'This is not payment promotion or a claim of the main promotion workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact immutable publication proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c7-maintenance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c7-maintenance/publication-receipt.json
            ${{ runner.temp }}/c7-maintenance/image-proof.json
            ${{ runner.temp }}/c7-maintenance/image-attestation.json
            ${{ runner.temp }}/c7-maintenance/evidence-attestation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
